name: ACAS
options:
  bundleIdPrefix: jp.acas
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, ja]
packages:
  ACASCore:
    path: ACASCore
targets:
  ACAS:
    type: application
    platform: iOS
    sources:
      - path: ACAS/Sources
      - path: ACAS/Resources/Localization/en.lproj
      - path: ACAS/Resources/Localization/ja.lproj
      - path: ACAS/Resources/Seeds
        type: folder
      - path: ACAS/Resources/Cases
        type: folder
    dependencies:
      - package: ACASCore
    info:
      path: ACAS/Info.plist
      properties:
        CFBundleDisplayName: ACAS
        CFBundleLocalizations: [en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.acas.ipad
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
