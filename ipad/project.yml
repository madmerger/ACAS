name: ACAS
options:
  developmentLanguage: ja
  knownRegions: [ja]
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  ACASCore:
    path: ACASCore
targets:
  ACAS:
    type: application
    platform: iOS
    sources:
      - ACAS/Sources
      - ACAS/Resources
    dependencies:
      - package: ACASCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 会計管理
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        PRODUCT_BUNDLE_IDENTIFIER: jp.acas.ipad
        TARGETED_DEVICE_FAMILY: 2
  ACASUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ACASUITests
      - path: .generated/fixtures
        optional: true
        type: folder
        buildPhase: resources
    dependencies:
      - target: ACAS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: jp.acas.ipad.uitests
schemes:
  ACAS:
    build:
      targets:
        ACAS: all
        ACASUITests: [test]
    test:
      targets:
        - ACASUITests
