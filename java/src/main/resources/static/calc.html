<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ACAS 計算ロジック</title>
<link rel="stylesheet" href="app.css">
<style>
 .calc { max-width: 900px; margin: 1em auto; }
 .calc fieldset { margin: .8em 0; border: 1px solid #456; padding: .6em 1em; }
 .calc label { margin-right: 1em; }
 .calc input { font: inherit; width: 10em; }
 .calc output { display: inline-block; min-width: 22em; margin-left: 1em; color: #ff6; font-family: monospace; }
</style>
</head>
<body>
<header><h1>ACAS 計算ロジック</h1><nav><a href="index.html">業務画面</a></nav></header>
<div id="case-banner" class="case-banner" hidden></div>
<main class="calc">
 <fieldset id="f-check"><legend>チェックディジット（顧客・仕入先コード）</legend>
  <label>コード（6 桁） <input id="code" maxlength="6"></label><button data-calc="check">計算</button><output id="o-check"></output></fieldset>
 <fieldset id="f-date"><legend>日付変換（日/月/年 → 通算日）</legend>
  <label>日付 <input id="date" maxlength="11"></label><button data-calc="date">変換</button><output id="o-date"></output></fieldset>
 <fieldset id="f-vat"><legend>消費税（VAT）額</legend>
  <label>税抜金額 <input id="net"></label><label>税率(%) <input id="rate"></label><button data-calc="vat">計算</button><output id="o-vat"></output></fieldset>
 <fieldset id="f-age"><legend>債権年齢区分</legend>
  <label>経過日数 <input id="days"></label><button data-calc="age">判定</button><output id="o-age"></output></fieldset>
 <fieldset id="f-avg"><legend>在庫平均原価</legend>
  <label>在庫金額 <input id="value"></label><label>数量 <input id="qty"></label><button data-calc="avg">計算</button><output id="o-avg"></output></fieldset>
</main>
<script>
const v = id => document.getElementById(id).value;
const q = o => new URLSearchParams(o).toString();
const defs = {
  check: () => ['/api/calc/check-digit?' + q({code: v('code')}), r => r.valid ? 'チェックディジット: ' + r.check + '（有効）' : 'コード不正'],
  date: () => ['/api/calc/date?' + q({date: v('date')}), r => r.valid ? '通算日: ' + r.integer + '　日付: ' + r.normalized : '日付不正（通算日 0）'],
  vat: () => ['/api/calc/vat?' + q({net: v('net'), rate: v('rate')}), r => '税額: ' + r.vat],
  age: () => ['/api/calc/age?' + q({days: v('days')}), r => '区分: ' + (r.bucket === 0 ? '当月（30 日未満）' : r.bucket + ' 日' + (r.bucket === 90 ? '以上' : '台')) + ' [' + r.bucket + ']'],
  avg: () => ['/api/calc/average-cost?' + q({value: v('value'), qty: v('qty')}), r => r.cost === null ? '計算不可（数量 0）' : '平均原価: ' + r.cost],
};
async function calc(name) {
  const [url, fmt] = defs[name]();
  const out = document.getElementById('o-' + name);
  try {
    const res = await fetch(url);
    if (!res.ok) { out.textContent = '入力エラー'; out.dataset.result = ''; return; }
    const r = await res.json();
    out.textContent = fmt(r); out.dataset.result = JSON.stringify(r);
  } catch (e) { out.textContent = '通信エラー'; }
}
document.querySelectorAll('button[data-calc]').forEach(b => b.addEventListener('click', () => calc(b.dataset.calc)));
document.querySelectorAll('.calc input').forEach(i => i.addEventListener('keydown', e => {
  if (e.key === 'Enter') i.closest('fieldset').querySelector('button').click(); }));
const p = new URLSearchParams(location.search);
window.acasSetCase = (id, title) => { const b = document.getElementById('case-banner'); b.hidden = false; b.textContent = 'ケース ' + id + '： ' + (title || ''); };
if (p.get('case')) window.acasSetCase(p.get('case'), p.get('title'));
</script>
</body>
</html>
