<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>帳票｜ACAS 会計システム</title>
  <link rel="stylesheet" href="app.css">
  <script src="reports.js" type="module"></script>
</head>
<body>
<header class="topbar">
  <a href="/" class="brand">ACAS <span>会計システム</span></a>
  <nav aria-label="関連機能"><a href="/">業務画面</a><a href="calc.html">計算ツール</a></nav>
</header>
<main class="page">
  <div class="view-header"><h1>帳票一覧</h1><p id="status" role="status"></p></div>
  <div class="table-scroll">
    <table>
      <thead><tr><th scope="col">帳票</th><th scope="col">出力区分</th><th scope="col">行数</th></tr></thead>
      <tbody id="reports"></tbody>
    </table>
  </div>
  <dialog id="report" aria-labelledby="report-title">
    <div class="dialog-header">
      <h2 id="report-title"></h2>
      <form method="dialog"><button>閉じる</button></form>
    </div>
    <pre class="report" id="report-content"></pre>
  </dialog>
</main>
</body>
</html>
