<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>ACAS 文言対応表</title><link rel="stylesheet" href="app.css"></head>
<body><div class="page">
<h2>文言対応表（レガシー英語 → 日本語）</h2>
<table id="t"><thead><tr><th>レガシー原文（英語）</th><th>日本語表示</th></tr></thead><tbody></tbody></table>
</div>
<script>
(async function () {
  const m = await (await fetch('api/messages')).json(), tb = document.querySelector('#t tbody');
  Object.keys(m).forEach(k => {
    const tr = document.createElement('tr'), a = document.createElement('td'), b = document.createElement('td');
    a.textContent = k; b.textContent = m[k]; tr.appendChild(a); tr.appendChild(b); tb.appendChild(tr);
  });
})();
</script></body></html>
