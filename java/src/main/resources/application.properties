server.port=8080
spring.datasource.url=jdbc:h2:file:${acas.data-dir:./data}/acas;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# 起動時にデータが空の場合に読み込む初期データ（baselines/<名前>.json）。空文字で読み込まない。
acas.initial-baseline=biz
# 同一性検証用 API（/api/test/**）。本番では false のままにする。
acas.test-api=false
# 検証用の固定日付（yyyy-MM-dd）。空ならシステム日付。
acas.fixed-date=
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
