name: Legacy oracle

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install GnuCOBOL (native ISAM backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol=5 gnucobol3=3.1.2-5.1ubuntu1
          cobc -V
          cobc -info
      - name: Install oracle dependencies
        run: python3 -m pip install -r tools/oracle/requirements.txt
      - name: Build, seed, drive terminal, export and compare
        run: python3 tools/oracle/runner.py --compare
      - name: Converter tests
        run: python3 -m pytest -q tools/oracle/tests
      - name: Upload results, terminal transcripts and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-oracle-results
          path: tools/oracle/results/
